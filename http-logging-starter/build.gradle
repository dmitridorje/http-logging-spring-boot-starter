plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'ru.bakhtin.logging'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter:3.4.3'
    implementation 'org.springframework.boot:spring-boot-starter-web:3.4.3'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.4.3'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:3.4.3'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor:3.4.3'

    implementation 'org.aspectj:aspectjweaver:1.9.9.1'
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java

            groupId = 'ru.bakhtin.logging'
            artifactId = 'http-logging-starter'
            version = '0.0.1-SNAPSHOT'
        }
    }

    repositories {
        mavenLocal()
    }
}
